<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>图库 · LOOKTABLE</title>
  <meta name="description" content="Browse LUT looks in Chinese and English. 按分类浏览 LUT 色彩特点。">
  <meta name="theme-color" content="#0a162c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LOOKTABLE">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="gallery" data-title-key="galleryTitle">
  <div id="site-header"></div>
  <main class="container">
    <section class="page-hero">
      <h1 data-i18n="galleryTitle">图库</h1>
      <p class="muted" data-i18n="galleryLead">点开卡片查看特点并下载。</p>
    </section>
    <div class="toolbar">
      <div id="gallery-filters" class="chips"></div>
      <input id="gallery-search" class="search" type="search" data-i18n-placeholder="search" placeholder="搜索名称或特点">
    </div>
    <p id="gallery-count" class="muted"></p>
    <div id="gallery-grid" class="card-grid"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/lut.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
